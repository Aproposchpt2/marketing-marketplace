<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Federal Opportunity Workspace | APROPOS</title><style>:root{--navy:#0E1D36;--gold:#C8A84B;--paper:#f5f7fa;--ink:#182238;--muted:#647087;--green:#16794b;--amber:#8a6c18}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--paper);color:var(--ink)}header{background:var(--navy);color:#fff;padding:22px;border-bottom:4px solid var(--gold)}header>div,main{max-width:1120px;margin:auto}.brand{font-weight:800;letter-spacing:.1em}.sub{color:#cfd8e5;font-size:13px;margin-top:5px}main{padding:38px 20px 70px}.banner{background:#fff;border:1px solid #dce3eb;border-radius:16px;padding:28px;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:#8a6c18}.complimentary{display:inline-block;background:#f8f1d9;color:#725913;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:12px}h1{font-family:Georgia,serif;color:var(--navy);font-size:38px;margin:8px 0}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.meta div{background:#f7f9fb;padding:13px;border-radius:8px}.meta small{display:block;color:var(--muted);margin-bottom:5px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.panel{background:#fff;border:1px solid #dce3eb;border-radius:16px;padding:25px;margin-bottom:20px}h2{font-family:Georgia,serif;color:var(--navy);margin:0 0 15px}.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:13px 17px;border-radius:8px;font-weight:800;border:0;cursor:pointer}.btn.gold{background:#8a6c18}.btn.secondary{background:#fff;color:var(--navy);border:1px solid #bcc6d3}.docs{list-style:none;padding:0;margin:14px 0}.docs li{padding:12px 0;border-bottom:1px solid #e6ebf0}.docs strong{color:#163e70}.service{border:1px solid #dfe5ec;border-radius:12px;padding:17px;margin-top:12px}.service h3{margin:0 0 7px;color:var(--navy)}.service p,.note{color:var(--muted);line-height:1.55}.status{display:inline-block;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.status.ok{background:#e8f5ee;color:var(--green)}.status.warn{background:#f8f1d9;color:var(--amber)}.error{background:#fff0f0;color:#8b1e1e;padding:18px;border-radius:10px}.warning{background:#fff9e9;color:#6e5713;border-left:4px solid var(--gold);padding:14px;margin:15px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}@media(max-width:800px){.grid,.meta{grid-template-columns:1fr}}</style></head><body><header><div><div class="brand">APROPOS GROUP LLC</div><div class="sub">Secure Federal Opportunity Workspace</div></div></header><main id="app"><div class="panel">Loading your complimentary federal contract opportunity…</div></main><script>
'use strict';
const app=document.getElementById('app'),token=sessionStorage.getItem('aproposFederalOpportunityToken');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(v){if(!v)return'See SAM.gov';try{return new Date(v).toLocaleDateString('en-US',{dateStyle:'long'})}catch{return v}}
function place(p){if(!p)return'—';const city=p.city?.name||p.city||'';const state=p.state?.name||p.state?.code||p.state||'';const country=p.country?.name||p.country?.code||p.country||'';return [city,state,country].filter(Boolean).join(', ')||'—'}
async function load(){
  if(!token){app.innerHTML='<div class="error">This federal workspace session is unavailable. Return to the Marketplace claim page and claim your opportunity.</div>';return}
  try{
    const r=await fetch('/api/federal-opportunity?action=workspace&t='+encodeURIComponent(token));
    const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||'Workspace unavailable.');
    const o=d.opportunity,docs=d.documents||[],pkg=d.package||{};
    const packageClass=pkg.verification_status==='CURRENT_NOTICE_REFRESHED'?'ok':'warn';
    const packageLabel=o.package_status==='PUBLIC_SAM_RESOURCES_AVAILABLE'?'PUBLIC SAM RESOURCES AVAILABLE':o.package_status==='PUBLIC_SAM_NOTICE_AVAILABLE'?'PUBLIC SAM NOTICE AVAILABLE':'NO PUBLIC PACKAGE FOUND';
    app.innerHTML=`<section class="banner"><span class="complimentary">COMPLIMENTARY FEDERAL CONTRACT OPPORTUNITY</span><div class="eyebrow">${esc(d.access.business_name||'APROPOS Opportunity Workspace')}</div><h1>${esc(o.title)}</h1><p class="note">Review the current public SAM.gov opportunity resources available through this workspace. SAM.gov and the issuing agency remain authoritative.</p><div class="meta"><div><small>Agency</small>${esc(o.agency||'—')}</div><div><small>Solicitation</small>${esc(o.solicitation_number||o.notice_id||'—')}</div><div><small>Response Deadline</small>${esc(date(o.response_deadline))}</div><div><small>Package Status</small>${esc(packageLabel)}</div></div></section><div class="grid"><div><section class="panel"><h2>Federal Contract Package</h2><p>APROPOS packages the public attachments and current notice description that can be retrieved from SAM.gov at download time.</p><div class="actions">${pkg.download_available?`<a class="btn" id="package" href="/api/federal-opportunity?action=package&t=${encodeURIComponent(token)}">Download Contract Package</a>`:''}${o.sam_url?`<a class="btn secondary" href="${esc(o.sam_url)}" target="_blank" rel="noopener">Open Official SAM.gov</a>`:''}</div><p><span class="status ${packageClass}">${esc(pkg.verification_status||'SOURCE STATUS')}</span></p>${pkg.warning?`<div class="warning">${esc(pkg.warning)}</div>`:''}<p class="note">${esc(pkg.note||'')}</p><h2 style="font-size:23px;margin-top:28px">Current Public Resources</h2><ul class="docs">${docs.map(x=>`<li><strong>${String(x.number).padStart(2,'0')} · ${esc(x.label||'SAM.gov attachment')}</strong><br><small>${esc(x.source_url||'SAM.gov resource')}</small></li>`).join('')||'<li>No public attachment links are currently reported by SAM.gov for this notice.</li>'}</ul>${o.description_url?'<p class="note">The SAM.gov notice description will also be included in the package when retrievable.</p>':''}<div class="warning"><strong>Authority notice:</strong> This workspace does not replace SAM.gov. Check the official notice for amendments, controlled files, external agency repositories, eligibility requirements, and submission instructions.</div></section></div><aside><section class="panel"><h2>Your Next Step</h2><div class="service"><h3>Analyze Fit</h3><p>Evaluate how your registered business capabilities align with this federal opportunity.</p><a class="btn gold" href="https://ai4-product-purchasing.ai4businesses.org/analyze-fit">Analyze Fit</a></div><div class="service"><h3>Contract Assistance Program</h3><p>Get structured help understanding the solicitation package, requirements, deadlines, and pursuit considerations.</p><a class="btn gold" href="https://cdc.aproposgroupllc.com/contract-assistance">Contract Assistance</a></div><div class="service"><h3>Contract Proposal Development</h3><p>When you decide to pursue, move from contract understanding into proposal development.</p><a class="btn" href="https://cdc.aproposgroupllc.com/contract-proposal-development">Develop My Proposal</a></div></section><section class="panel"><h2>Workspace Access</h2><p class="note">Claimed ${esc(date(d.access.claimed_at))}<br>Access expires ${esc(date(d.access.expires_at))}</p></section></aside></div>`;
  }catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
load();
</script></body></html>
