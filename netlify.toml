[build]
  command = "node scripts/apply-marketplace-analytics.cjs && node scripts/run-marketplace-production-suite.cjs && node scripts/apply-marketplace-property-pages.cjs && node scripts/apply-apropos-visual-standard.cjs && node scripts/apply-marketplace-hero-building-balance.cjs && node scripts/apply-seo-production.cjs && node scripts/apply-rfcp-federal-state-truth.cjs && node scripts/generate-marketplace-articles.cjs && node scripts/apply-government-contract-portal-marketplace.cjs && node scripts/apply-live-property-allowlist.cjs && node scripts/apply-business-intelligence-marketplace-rebrand.cjs && node scripts/apply-ai4-intelligence-messaging.cjs && node scripts/apply-ai4-contact-center-page.cjs && node scripts/apply-ai4-contact-center-premium-style.cjs && node scripts/apply-marketplace-reviews-home.cjs && node scripts/finalize-marketplace-seo-geo.cjs && node scripts/validate-marketplace-production-suite.cjs && node scripts/validate-apropos-visual-standard.cjs && node scripts/validate-marketplace-article-engine.cjs && node scripts/validate-government-contract-portal-marketplace.cjs && node scripts/validate-marketplace-seo-geo.cjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# E2E deployment marker: 2026-09-17

[[headers]]
  for = "/claim-opportunity.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow,noarchive"

[[headers]]
  for = "/claim-federal-opportunity.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow,noarchive"

[[headers]]
  for = "/federal-opportunity-workspace.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow,noarchive"

[[headers]]
  for = "/opportunity-workspace.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex,nofollow,noarchive"

[[headers]]
  for = "/opportunity-thank-you.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex,nofollow,noarchive"

# The Marketplace is retired (2026-11-19). Its public pages now live on
# stellaruc.com and sbda.stellaruc.com. The private claim/workspace pages
# (claim-opportunity, claim-federal-opportunity, opportunity-workspace,
# federal-opportunity-workspace, opportunity-thank-you) and /api/* are
# intentionally NOT redirected so links in emails already sent keep working.

[[redirects]]
  from = "/apropos-business-opportunity-agency/*"
  to = "https://sbda.stellaruc.com/"
  status = 301
  force = true

