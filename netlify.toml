[build]
  command = "node scripts/apply-marketplace-customer-experience.cjs && node scripts/apply-marketplace-homepage-cleanup.cjs && node scripts/apply-marketplace-dark-sections.cjs && node scripts/validate-marketplace-customer-experience.cjs && node scripts/validate-marketplace-homepage-cleanup.cjs && node scripts/validate-marketplace-dark-sections.cjs && node scripts/apply-seo-production.cjs && node scripts/apply-entity-graph-remediation.cjs && node scripts/apply-live-property-allowlist.cjs && node scripts/apply-marketplace-authority-handoffs.cjs && node scripts/validate-marketplace-authority-handoffs.cjs && node scripts/apply-marketplace-trust-governance.cjs && node scripts/validate-marketplace-trust-governance.cjs && node scripts/generate-marketplace-articles.cjs && node scripts/validate-marketplace-article-engine.cjs && node scripts/validate-marketplace-initial-articles.cjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/claim-opportunity.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/claim-federal-opportunity.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/federal-opportunity-workspace.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/opportunity-thank-you.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow, noarchive"
