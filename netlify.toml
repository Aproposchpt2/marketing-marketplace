[build]
  command = "node scripts/apply-marketplace-analytics.cjs && node scripts/run-marketplace-production-suite.cjs && node scripts/apply-seo-production.cjs && node scripts/apply-live-property-allowlist.cjs && node scripts/validate-marketplace-production-suite.cjs"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/claim-opportunity.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow,noarchive"

[[headers]]
  for = "/claim-federal-opportunity.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow,noarchive"

[[headers]]
  for = "/federal-opportunity-workspace.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex, nofollow,noarchive"

[[headers]]
  for = "/opportunity-workspace.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex,nofollow,noarchive"

[[headers]]
  for = "/opportunity-thank-you.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    X-Robots-Tag = "noindex,nofollow,noarchive"
