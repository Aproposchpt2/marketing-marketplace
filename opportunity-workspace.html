async function load(){if(!token){app.innerHTML='<div class="error">This workspace session is unavailable. Return to the Marketplace claim page and claim your opportunity.</div>';return}try{const r=await fetch('/api/complimentary-opportunity?action=workspace&t='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Workspace unavailable.');const o=d.opportunity;app.innerHTML=d.paid?renderUnlocked(d,o):renderLocked(d,o);}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}document.addEventListener('click',e=>{const link=e.target instanceof Element?e.target.closest('#package'):null;if(!link)return;e.preventDefault();const download=document.createElement('a');download.href=link.href;download.download='';download.style.display='none';document.body.appendChild(download);download.click();download.remove();setTimeout(()=>location.assign('/opportunity-thank-you.html'),1200)});load();</script></body></html>
