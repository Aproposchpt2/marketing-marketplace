<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Complimentary Contract Opportunity | APROPOS</title>
<style>
:root{--navy:#0E1D36;--gold:#C8A84B;--paper:#f5f7fa;--ink:#182238;--muted:#647087;--green:#16794b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:22px;border-bottom:4px solid var(--gold)}header>div,main{max-width:1040px;margin:auto}.brand{font-weight:800;letter-spacing:.1em}.sub{color:#cfd8e5;font-size:13px;margin-top:5px}
main{padding:38px 20px 70px}.panel{background:#fff;border:1px solid #dce3eb;border-radius:16px;padding:28px;margin-bottom:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:#8a6c18}.pill{display:inline-block;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#e3f4ea;color:#0f5132;margin-bottom:12px}h1{font-family:Georgia,serif;color:var(--navy);font-size:40px;line-height:1.08;margin:8px 0 12px}.lead{color:var(--muted);line-height:1.7}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.meta div{background:#f7f9fb;padding:14px;border-radius:8px}.meta small{display:block;color:var(--muted);margin-bottom:5px}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:20px}.panel h2{font-family:Georgia,serif;color:var(--navy);margin:0 0 15px}.scope{line-height:1.75;white-space:pre-line}.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:14px 18px;border-radius:8px;font-weight:800}.btn:hover{background:#162d50}.reference{font-family:monospace;font-weight:800}.fine{font-size:12px;color:var(--muted);line-height:1.6}.error{background:#fff0f0;color:#8b1e1e;padding:18px;border-radius:10px}.notice{background:#f8f5ea;border-left:4px solid var(--gold);padding:16px 18px;line-height:1.6}@media(max-width:800px){.grid,.meta{grid-template-columns:1fr}h1{font-size:33px}}
</style>
</head>
<body>
<header><div><div class="brand">APROPOS GROUP LLC</div><div class="sub">Government Contract Marketplace</div></div></header>
<main id="app"><div class="panel">Loading your complimentary contract opportunity…</div></main>
<script>
'use strict';
const app=document.getElementById('app');
const token=sessionStorage.getItem('aproposOpportunityToken');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=v=>{if(!v)return'See authoritative procurement site';const d=new Date(v);return isNaN(d.getTime())?String(v):d.toLocaleDateString('en-US',{dateStyle:'long'})};
const money=v=>{if(v===null||v===undefined||v==='')return'';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}):String(v)};
function valueRange(o){const lo=money(o.estimated_value_min),hi=money(o.estimated_value_max);if(lo&&hi)return `${lo} – ${hi}`;return lo||hi||'Not stated'}
function list(v){return Array.isArray(v)&&v.length?v.join(', '):'Not specified'}
function render(d){
 const o=d.opportunity||{},a=d.access||{},url=o.authoritative_url||'';
 const authoritative=url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">OPEN AUTHORITATIVE PROCUREMENT SITE →</a>`:'<p class="fine">The authoritative procurement link is not currently available. Contact APROPOS for assistance.</p>';
 app.innerHTML=`
 <section class="panel">
   <span class="pill">COMPLIMENTARY CONTRACT OPPORTUNITY</span>
   <div class="eyebrow">Prepared for ${esc(a.client_business_name||'your business')}</div>
   <h1>${esc(o.title||'Government Contract Opportunity')}</h1>
   <p class="lead">APROPOS identified this opportunity for your business. Review the contract details below, then use the issuing authority's procurement site for the official solicitation and supporting documents.</p>
   <div class="meta">
     <div><small>Agency</small>${esc(o.agency_name||'—')}</div>
     <div><small>Solicitation</small>${esc(o.solicitation_number||'—')}</div>
     <div><small>Response Deadline</small>${esc(date(o.response_deadline))}</div>
     <div><small>Location</small>${esc(o.place_of_performance||[o.city,o.state].filter(Boolean).join(', ')||'Not stated')}</div>
     <div><small>Set-Aside</small>${esc(o.set_aside_type||'Not stated')}</div>
     <div><small>Estimated Value</small>${esc(valueRange(o))}</div>
   </div>
 </section>
 <div class="grid">
   <section class="panel">
     <h2>Contract Details</h2>
     <p class="scope">${esc(o.scope_summary||o.description||'See the authoritative procurement site for the complete scope and solicitation requirements.')}</p>
     <div class="meta">
       <div><small>NAICS</small>${esc(list(o.naics_codes))}</div>
       <div><small>NIGP</small>${esc(list(o.nigp_codes))}</div>
       <div><small>Opportunity Reference</small><span class="reference">${esc(a.opportunity_reference||'—')}</span></div>
     </div>
   </section>
   <aside>
     <section class="panel">
       <h2>Official Solicitation</h2>
       <div class="notice"><strong>The issuing authority is the source of truth.</strong><br>Use the official procurement site to review all solicitation documents, amendments, forms, instructions, and submission requirements.</div>
       <div style="margin-top:18px">${authoritative}</div>
       <p class="fine" style="margin-top:14px">APROPOS provides contract discovery and contract details. Always verify current requirements and deadlines with the issuing authority before responding.</p>
     </section>
   </aside>
 </div>`;
}
async function load(){
 if(!token){app.innerHTML='<div class="error">This workspace session is unavailable. Return to the Marketplace claim page and claim your opportunity again.</div>';return}
 try{
   const r=await fetch('/api/complimentary-opportunity?action=workspace&t='+encodeURIComponent(token),{cache:'no-store'});
   const d=await r.json();
   if(!r.ok||!d.ok)throw new Error(d.error||'Workspace unavailable.');
   render(d);
 }catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
}
load();
</script>
</body>
</html>
