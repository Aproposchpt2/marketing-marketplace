int();document.getElementById('analyzeFit').addEventListener('click',()=>workspaceEvent('analyze_fit_requested'));document.getElementById('package').onclick=async()=>{const b=document.getElementById('package'),st=document.getElementById('downloadStatus');b.disabled=true;st.hidden=false;st.textContent='Preparing your contract package…';try{const pr=await fetch('/api/complimentary-opportunity?action=package&t='+encodeURIComponent(token));if(!pr.ok)throw new Error((await pr.json().catch(()=>({}))).error||'Package download failed.');const blob=await pr.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileNameFromDisposition(pr.headers.get('content-disposition'));document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);st.textContent='Your contract package download has started. Good luck!';setTimeout(()=>location.assign('/opportunity-thank-you.html'),900)}catch(e){st.textContent=e.message;b.disabled=false}};document.querySelectorAll('.doc-link').forEach(link=>link.addEventListener('click',()=>setTimeout(()=>location.assign('/opportunity-thank-you.html'),1200)))}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}load();</script></body></html>
