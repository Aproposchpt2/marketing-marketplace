name: APROPOS Marketplace Branch Implementation

on:
  push:
    branches:
      - seo-marketing-marketplace-production-v1
    paths:
      - .github/workflows/marketplace-implementation.yml

permissions:
  contents: write

env:
  IMPLEMENTATION_BRANCH: seo-marketing-marketplace-production-v1

jobs:
  implement-validate-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMPLEMENTATION_BRANCH }}
          fetch-depth: 0

      - name: Reassemble auditable implementation sources
        run: |
          mkdir -p scripts
          cat .automation/implement.part* | base64 --decode | gzip --decompress > scripts/implement_marketplace.py
          cat .automation/validate.part* | base64 --decode | gzip --decompress > scripts/validate_marketplace.py
          cat .automation/capture.part* | base64 --decode | gzip --decompress > scripts/capture_marketplace.py
          python -m py_compile scripts/implement_marketplace.py scripts/validate_marketplace.py scripts/capture_marketplace.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install implementation and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow qrcode playwright
          python -m playwright install --with-deps chromium

      - name: Preserve current marketplace and implement branch version
        run: python scripts/implement_marketplace.py

      - name: Validate metadata, schema, links, forms, images, and analytics
        run: python scripts/validate_marketplace.py

      - name: Capture desktop and mobile screenshots
        run: |
          python -m http.server 4173 --bind 127.0.0.1 > /tmp/marketplace-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          python scripts/capture_marketplace.py

      - name: Record implementation inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          files = sorted(
              p.as_posix() for p in root.rglob('*')
              if p.is_file() and '.git' not in p.parts
          )
          Path('validation').mkdir(exist_ok=True)
          Path('validation/files-modified.json').write_text(
              json.dumps({
                  'branch': 'seo-marketing-marketplace-production-v1',
                  'production_modified': False,
                  'files_present_after_implementation': files,
              }, indent=2),
              encoding='utf-8'
          )
          PY

      - name: Commit branch implementation and validation artifacts
        run: |
          git config user.name "APROPOS Marketplace Implementation Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "Implement marketplace SEO campaign and conversion architecture"
            git push origin HEAD:${IMPLEMENTATION_BRANCH}
          fi

      - name: Upload validation package
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-validation-package
          path: |
            validation/
            assets/legacy-assets-manifest.json
            robots.txt
            sitemap.xml
          if-no-files-found: error
          retention-days: 30
