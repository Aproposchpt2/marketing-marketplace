name: Apply complimentary opportunity homepage CTA

on:
  push:
    paths:
      - '.github/workflows/apply-complimentary-opportunity-cta.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Marketplace homepage CTA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<section class="membership-call">'
          block = '''<section class="membership-call" id="complimentary-opportunity">
            <div class="section-inner">
              <div class="eyebrow">Complimentary Contract Opportunity</div>
              <h2>Have an APROPOS Opportunity Reference?</h2>
              <p>If APROPOS sent your business a complimentary contract opportunity, use the Opportunity Reference from your introduction to securely claim the verified contract package prepared for you.</p>
              <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center">
                <a class="btn-gold" href="/claim-opportunity.html">CLAIM YOUR COMPLIMENTARY CONTRACT OPPORTUNITY &rarr;</a>
              </div>
            </div>
          </section>

          '''
          if 'id="complimentary-opportunity"' not in s:
              if marker not in s:
                  raise SystemExit('Homepage insertion marker not found')
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          PY
      - name: Commit homepage CTA
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add complimentary opportunity homepage CTA"
          git push
