name: Apply complimentary opportunity homepage CTA

on:
  push:
    paths:
      - '.github/workflows/apply-complimentary-opportunity-cta.yml'

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Place Marketplace claim CTA inside landing hero
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Remove any previously-added complimentary CTA block outside the hero.
          s = re.sub(r'<section class="membership-call" id="complimentary-opportunity">.*?</section>\s*', '', s, count=1, flags=re.S)
          s = re.sub(r'<div id="hero-complimentary-claim".*?</div>\s*', '', s, count=1, flags=re.S)

          hero_start = s.find('<section class="hero"')
          if hero_start < 0:
              raise SystemExit('Hero section not found')
          hero_end = s.find('</section>', hero_start)
          if hero_end < 0:
              raise SystemExit('Hero section closing tag not found')

          cta = '''\n    <div id="hero-complimentary-claim" style="margin-top:1.25rem">\n      <a class="btn-gold" href="/claim-opportunity.html">CLAIM YOUR COMPLIMENTARY CONTRACT OPPORTUNITY &rarr;</a>\n    </div>\n'''

          # Put the CTA directly inside the first-view landing/hero section.
          s = s[:hero_end] + cta + s[hero_end:]
          p.write_text(s)
          PY
      - name: Commit homepage CTA placement
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place complimentary claim CTA in landing hero"
          git push
