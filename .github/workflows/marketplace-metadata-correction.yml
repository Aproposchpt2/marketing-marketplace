name: APROPOS Marketplace Metadata Correction

on:
  push:
    branches:
      - fix-marketplace-production-metadata-v1
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  correct-validate-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-marketplace-production-metadata-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow playwright
          python -m playwright install chromium --with-deps

      - name: Apply identity, metadata, pricing, and social-image corrections
        run: python scripts/apply_marketplace_metadata.py

      - name: Validate metadata, JSON-LD, pricing, links, forms, and indexability
        run: python scripts/validate_marketplace_metadata.py

      - name: Capture desktop and mobile renderings
        run: python scripts/capture_marketplace_preview.py

      - name: Commit validated correction package
        run: |
          git config user.name "APROPOS Marketplace Metadata Agent"
          git config user.email "actions@users.noreply.github.com"
          git add index.html og-marketplace.jpg robots.txt sitemap.xml validation
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Correct Marketplace production identity and metadata"
            git push origin HEAD:fix-marketplace-production-metadata-v1
          fi
