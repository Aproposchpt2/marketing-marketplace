name: APROPOS Marketplace Live Production Verification

on:
  push:
    branches:
      - fix-marketplace-production-metadata-v1
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify-live-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4
        with:
          ref: fix-marketplace-production-metadata-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependency
        run: python -m pip install pillow

      - name: Verify public production source and assets
        run: python scripts/verify_live_marketplace.py

      - name: Commit live verification evidence
        run: |
          git config user.name "APROPOS Marketplace Live Verification Agent"
          git config user.email "actions@users.noreply.github.com"
          git add validation/live-production-verification.json
          if git diff --cached --quiet; then
            echo "Live verification evidence is current."
          else
            git commit -m "Record live Marketplace production verification"
            git push origin HEAD:fix-marketplace-production-metadata-v1
          fi
